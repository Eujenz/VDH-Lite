<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VDH Lite</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="24" height="24">
        <div>
          <strong>VDH Lite</strong>
          <span id="page-host">Current tab</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="grant" class="secondary" type="button">Grant site</button>
        <button id="settings-toggle" class="icon-button" type="button" title="Settings" aria-label="Settings">&#9881;</button>
      </div>
    </header>
    <main>
      <section id="status-card" class="status-card">
        <div>
          <div id="status" class="status-title">Loading...</div>
          <div id="status-detail" class="status-detail">Checking native host and scanning the active tab.</div>
        </div>
      </section>
      <section id="settings-panel" class="settings" hidden>
        <div class="section-heading">Settings</div>
        <label for="download-dir">Save folder</label>
        <div class="input-row">
          <input id="download-dir" type="text" placeholder="%USERPROFILE%\\Downloads\\VDH Lite">
          <button id="browse-dir" class="secondary" type="button">Browse</button>
          <button id="reset-dir" class="secondary" type="button">Reset</button>
        </div>
        <div class="settings-actions">
          <button id="test-native" type="button">Test native host</button>
          <button id="install-deps" class="secondary" type="button">Install missing</button>
          <button id="copy-diagnostics" class="secondary" type="button">Copy diagnostics</button>
        </div>
        <div id="deps-status" class="deps-status">Checking dependencies...</div>
      </section>
      <section id="media-panel" class="media-panel">
        <div class="panel-header media-header">
          <div>
            <div class="section-heading">Detected media</div>
            <div id="media-summary" class="section-subtitle">Scanning current tab...</div>
          </div>
          <div class="media-actions">
            <button id="refresh" class="secondary" type="button">Refresh</button>
            <button id="clear" class="secondary" type="button">Clear</button>
          </div>
        </div>
        <div id="media-filters" class="filter-chips" role="group" aria-label="Media filters"></div>
        <ul id="items"></ul>
      </section>
      <section id="jobs-panel" class="jobs-panel">
        <div class="panel-header">
          <div>
            <div class="section-heading">Downloads</div>
            <div class="section-subtitle">Recent native host jobs</div>
          </div>
          <button id="clear-jobs" class="secondary" type="button">Clear finished</button>
        </div>
        <div id="jobs"></div>
      </section>
      <section id="command-panel" hidden>
        <label for="command-output">Download details</label>
        <textarea id="command-output" readonly rows="4"></textarea>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
